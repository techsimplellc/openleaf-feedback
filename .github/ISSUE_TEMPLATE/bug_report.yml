name: Bug report
description: Something in openleaf doesn't work as it should.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. **This issue will be public**, so don't include private document content, file paths or personal details.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem. A short sample of Markdown helps if the bug depends on the document.
      placeholder: |
        1. Open ...
        2. Type ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: openleaf version
      description: Shown in Help > About openleaf.
      placeholder: "0.17.1"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How are you using openleaf?
      options:
        - In a browser tab
        - Installed app (PWA)
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: "Chrome 141 on Windows 11"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, console errors, or how often it happens.
